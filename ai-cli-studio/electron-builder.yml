appId: com.aicli.studio
productName: AI CLI Studio
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - '!node_modules/**/*'
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
